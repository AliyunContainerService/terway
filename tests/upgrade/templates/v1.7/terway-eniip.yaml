apiVersion: apps/v1
kind: Deployment
metadata:
  name: terway-controlplane
  namespace: kube-system
  labels:
    k8s-app: terway-controlplane
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: terway-controlplane
  template:
    metadata:
      labels:
        k8s-app: terway-controlplane
    spec:
      hostNetwork: true
      serviceAccountName: terway
      priorityClassName: system-node-critical
      tolerations:
      - operator: "Exists"
      containers:
      - name: terway-controlplane
        image: registry-cn-hangzhou.ack.aliyuncs.com/acs/terway-controlplane:v1.7.4
        imagePullPolicy: IfNotPresent
        command:
        - /usr/bin/terway-controlplane
        - "-v"
        - "2"
        ports:
        - name: healthz
          containerPort: 8080
          protocol: TCP
        - name: metrics
          containerPort: 8081
          protocol: TCP
        env:
        - name: K8S_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: K8S_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: MY_POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - name: config-vol
          mountPath: /etc/config
          readOnly: true
        - name: secret-vol
          mountPath: /etc/credential
          readOnly: true
        - name: addon-token
          mountPath: /var/addon
          readOnly: true
      volumes:
      - name: secret-vol
        secret:
          secretName: terway-controlplane-credential
      - name: config-vol
        configMap:
          name: terway-controlplane
          items:
          - key: ctrl-config.yaml
            path: ctrl-config.yaml
      - name: addon-token
        secret:
          secretName: addon.network.token
          items:
          - key: addon.token.config
            path: token-config
          optional: true
