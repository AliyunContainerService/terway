---

apiVersion: batch/v1
kind: Job
metadata:
  name: terway-preflight
  namespace: kube-system
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 10
  template:
    spec:
      hostNetwork: true
      priorityClassName: system-node-critical
      tolerations:
      - operator: "Exists"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: type
                operator: NotIn
                values:
                - virtual-kubelet
              - key: kubernetes.io/arch
                operator: In
                values:
                - amd64
                - arm64
              - key: kubernetes.io/os
                operator: In
                values:
                - linux
      containers:
      - name: preflight
        image: registry-cn-hangzhou.ack.aliyuncs.com/acs/terway:v1.7.4
        command:
        - sh
        - "-ce"
        - "if grep -q IPVlan /etc/eni/10-terway.conf ; then cilium preflight register-crd ;fi;"
        volumeMounts:
        - name: configvolume
          mountPath: /etc/eni
      restartPolicy: OnFailure
      serviceAccountName: terway
      volumes:
      - name: configvolume
        configMap:
          name: eni-config
          items:
          - key: eni_conf
            path: eni.json
          - key: 10-terway.conf
            path: 10-terway.conf

---

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: terway-eniip
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: terway-eniip
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 3%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: terway-eniip
    spec:
      hostPID: true
      priorityClassName: system-node-critical
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: type
                operator: NotIn
                values:
                - virtual-kubelet
              - key: kubernetes.io/arch
                operator: In
                values:
                - amd64
                - arm64
              - key: kubernetes.io/os
                operator: In
                values:
                - linux
      tolerations:
      - operator: "Exists"
      terminationGracePeriodSeconds: 0
      serviceAccountName: terway
      hostNetwork: true
      initContainers:
      - name: terway-init
        image: registry-cn-hangzhou.ack.aliyuncs.com/acs/terway:v1.7.4
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        command:
        - /bin/init.sh
        volumeMounts:
        - name: config
          mountPath: /etc/eni
        - mountPath: /var-run-eni
          name: var-run-eni
        - name: configvolume
          mountPath: /tmp/eni
        - name: cni-bin
          mountPath: /opt/cni/bin/
        - name: cni
          mountPath: /etc/cni/net.d/
        - mountPath: /lib/modules
          name: lib-modules
        - mountPath: /host
          name: host-root
        - mountPath: /var/run/
          name: eni-run
      containers:
      - name: terway
        image: registry-cn-hangzhou.ack.aliyuncs.com/acs/terway:v1.7.4
        imagePullPolicy: IfNotPresent
        command: ["/usr/bin/terwayd", "-log-level", "info", "-daemon-mode", "ENIMultiIP"]
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
            - DAC_OVERRIDE
            drop:
            - ALL

        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAMESPACE
          valueFrom:
              fieldRef:
                fieldPath: metadata.namespace

        volumeMounts:
        - name: config
          mountPath: /etc/eni
          readOnly: true
        - mountPath: /var/run/
          name: eni-run
        - mountPath: /lib/modules
          name: lib-modules
        - mountPath: /var/lib/cni/networks
          name: cni-networks
        - mountPath: /var/lib/cni/terway
          name: cni-terway
        - mountPath: /var/lib/kubelet/device-plugins
          name: device-plugin-path
        - name: addon-token
          mountPath: "/var/addon"
          readOnly: true
        - name: alibaba-addon-secret
          mountPath: "/var/alibaba-addon-secret"
          readOnly: true
      - name: policy
        image: registry-cn-hangzhou.ack.aliyuncs.com/acs/terway:v1.7.4
        imagePullPolicy: IfNotPresent
        command: ["/bin/policyinit.sh"]
        env:
        - name: NODENAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: DISABLE_POLICY
          valueFrom:
            configMapKeyRef:
              name: eni-config
              key: disable_network_policy
              optional: true
        - name: FELIX_TYPHAK8SSERVICENAME
          valueFrom:
            configMapKeyRef:
              name: eni-config
              key: felix_relay_service
              optional: true
        - name: K8S_NODE_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        - name: CILIUM_K8S_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: CILIUM_CNI_CHAINING_MODE
          value: terway-chainer
        - name: IN_CLUSTER_LOADBALANCE
          valueFrom:
            configMapKeyRef:
              name: eni-config
              key: in_cluster_loadbalance
              optional: true
        securityContext:
          privileged: false
          capabilities:
            add:
            - NET_ADMIN
            - DAC_OVERRIDE
            - SYS_ADMIN
            - NET_RAW
            - SYS_MODULE

            - CHOWN
            - KILL
            - IPC_LOCK
            - SYS_RESOURCE
            - FOWNER
            - SETGID
            - SETUID

            drop:
            - ALL

        livenessProbe:
          httpGet: null
          tcpSocket:
            port: 9099
            host: 127.0.0.1
          periodSeconds: 10
          initialDelaySeconds: 10
          failureThreshold: 6
        readinessProbe:
          httpGet: null
          tcpSocket:
            port: 9099
            host: 127.0.0.1
          periodSeconds: 10
        volumeMounts:
        - mountPath: /var-run-eni
          name: var-run-eni
          readOnly: true
        - mountPath: /lib/modules
          name: lib-modules
        - mountPath: /etc/cni/net.d
          name: cni
          readOnly: true
        # volumes use by cilium
        - mountPath: /sys/fs
          name: sys-fs
        - mountPath: /var/run/cilium
          name: cilium-run
          # Needed to be able to load kernel modules
        - mountPath: /run/xtables.lock
          name: xtables-lock
      volumes:
      - name: config
        emptyDir: {}
      - name: var-run-eni
        emptyDir: { }
      - name: configvolume
        configMap:
          name: eni-config
          items: null
      - name: cni-bin
        hostPath:
          path: /opt/cni/bin
          type: "Directory"
      - name: cni
        hostPath:
          path: /etc/cni/net.d
      - name: eni-run
        hostPath:
          path: /var/run/
          type: "Directory"
      - name: lib-modules
        hostPath:
          path: /lib/modules
      - name: cni-networks
        hostPath:
          path: /var/lib/cni/networks
      - name: cni-terway
        hostPath:
          path: /var/lib/cni/terway
      - name: device-plugin-path
        hostPath:
          path: /var/lib/kubelet/device-plugins
          type: "Directory"
      - name: host-root
        hostPath:
          path: /
          type: "Directory"
      - name: addon-token
        secret:
          secretName: addon.network.token
          items:
          - key: addon.token.config
            path: token-config
          optional: true
      - name: alibaba-addon-secret
        secret:
          secretName: alibaba-addon-secret
          optional: true
      # used by cilium
      # To keep state between restarts / upgrades
      - hostPath:
          path: /var/run/cilium
          type: DirectoryOrCreate
        name: cilium-run
      # To keep state between restarts / upgrades for bpf maps
      - hostPath:
          path: /sys/fs/
          type: DirectoryOrCreate
        name: sys-fs
        # To access iptables concurrently with other processes (e.g. kube-proxy)
      - hostPath:
          path: /run/xtables.lock
          type: FileOrCreate
        name: xtables-lock

---

