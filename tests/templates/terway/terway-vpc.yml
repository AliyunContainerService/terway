apiVersion: v1
kind: ServiceAccount
metadata:
  name: terway
  namespace: kube-system

---

kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: terway-pod-reader
  namespace: kube-system
rules:
  - apiGroups:
      - ''
    resources:
      - pods
      - nodes
      - namespaces
      - configmaps
      - serviceaccounts
      - endpoints
      - services
    verbs:
      - get
      - watch
      - list
  - apiGroups:
      - ''
    resources:
      - pods
      - nodes
      - nodes/status
    verbs:
      - patch
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - watch
      - update
      - create
  - apiGroups:
      - ''
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - extensions
    resources:
      - networkpolicies
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ''
    resources:
      - pods/status
    verbs:
      - update
  - apiGroups:
      - crd.projectcalico.org
    resources:
      - '*'
    verbs:
      - '*'
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - create
      - get
      - list
      - watch
      - update
  - apiGroups:
      - cilium.io
    resources:
      - '*'
    verbs:
      - '*'
  - apiGroups:
      - network.alibabacloud.com
    resources:
      - '*'
    verbs:
      - '*'
  - apiGroups:
      - alibabacloud.com
    resources:
      - '*'
    verbs:
      - '*'

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: terway-binding
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: terway-pod-reader
subjects:
  - kind: ServiceAccount
    name: terway
    namespace: kube-system

---

kind: ConfigMap
apiVersion: v1
metadata:
  name: eni-config
  namespace: kube-system
data:
  eni_conf: |
    {
      "version": "1",
      "access_key": "ACCESS_KEY",
      "access_secret": "ACCESS_SECRET",
      "service_cidr": "SERVICE_CIDR",
      "security_group": "SECURITY_GROUP",
      "vswitches": {
        "cn-hongkong-b": ["VSWITCH"]
      },
      "max_pool_size": 5,
      "min_pool_size": 0
    }
  10-terway.conf: |
    {
      "cniVersion": "0.4.0",
      "name": "terway",
      "type": "terway"
    }

---

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: terway
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: terway
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 100%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: terway
    spec:
      hostPID: true
      priorityClassName: system-node-critical
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/os: linux
      tolerations:
        - operator: "Exists"
      terminationGracePeriodSeconds: 0
      serviceAccountName: terway
      hostNetwork: true
      initContainers:
        - name: terway-init
          image: TERWAY_IMAGE
          imagePullPolicy: Always
          securityContext:
            privileged: true
          command:
            - /bin/init.sh
          volumeMounts:
            - name: config
              mountPath: /etc/eni
            - name: configvolume
              mountPath: /tmp/eni
            - name: cni-config
              mountPath: /etc/cni/net.d
            - name: cni-bin
              mountPath: /opt/cni/bin/
            - mountPath: /lib/modules
              name: lib-modules
            - mountPath: /host
              name: host-root
            - mountPath: /var/run/
              name: eni-run
            - mountPath: /var-run-eni
              name: var-run-eni
            - mountPath: /var/lib/cni/networks
              name: cni-networks
      containers:
        - name: terway
          image: TERWAY_IMAGE
          imagePullPolicy: Always
          command: ["/usr/bin/terwayd", "-log-level", "info", "-daemon-mode", "VPC"]
          securityContext:
            privileged: true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: cni-config
              mountPath: /etc/cni/net.d
              readOnly: true
            - name: cni
              mountPath: /host-etc-net.d
            - name: config
              mountPath: /etc/eni
              readOnly: true
            - mountPath: /var/run/
              name: eni-run
            - mountPath: /lib/modules
              name: lib-modules
            - mountPath: /var/lib/cni/networks
              name: cni-networks
            - mountPath: /var/lib/cni/terway
              name: cni-terway
            - mountPath: /var/lib/kubelet/device-plugins
              name: device-plugin-path
        - name: policy
          image: TERWAY_IMAGE
          imagePullPolicy: Always
          command: ["/bin/policyinit.sh"]
          env:
            - name: NODENAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: Network
              value: POD_CIDR
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 250m
          livenessProbe:
            tcpSocket:
              port: 9099
              host: 127.0.0.1
            periodSeconds: 10
            initialDelaySeconds: 10
            failureThreshold: 6
          readinessProbe:
            tcpSocket:
              port: 9099
              host: 127.0.0.1
            periodSeconds: 10
          volumeMounts:
            - mountPath: /var-run-eni
              name: var-run-eni
            - mountPath: /lib/modules
              name: lib-modules
            - mountPath: /etc/cni/net.d
              name: cni
              readOnly: true
            - mountPath: /sys/fs
              name: sys-fs
            - mountPath: /var/run/cilium
              name: cilium-run
            - mountPath: /run/xtables.lock
              name: xtables-lock
      volumes:
        - name: cni-config
          emptyDir: {}
        - name: config
          emptyDir: {}
        - name: var-run-eni
          emptyDir: {}
        - name: configvolume
          configMap:
            name: eni-config
            items: null
        - name: cni-bin
          hostPath:
            path: /opt/cni/bin
            type: "Directory"
        - name: cni
          hostPath:
            path: /etc/cni/net.d
        - name: eni-run
          hostPath:
            path: /var/run/
            type: "Directory"
        - name: lib-modules
          hostPath:
            path: /lib/modules
        - name: cni-networks
          hostPath:
            path: /var/lib/cni/networks
            type: DirectoryOrCreate
        - name: cni-terway
          hostPath:
            path: /var/lib/cni/terway
        - name: device-plugin-path
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: "Directory"
        - name: host-root
          hostPath:
            path: /
            type: "Directory"
        - hostPath:
            path: /var/run/cilium
            type: DirectoryOrCreate
          name: cilium-run
        - hostPath:
            path: /sys/fs/
            type: DirectoryOrCreate
          name: sys-fs
        - hostPath:
            path: /run/xtables.lock
            type: FileOrCreate
          name: xtables-lock

---

